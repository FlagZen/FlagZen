name: Bug Report
description: Report a bug in FlagZen
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below so we can reproduce and fix it.

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which FlagZen module is affected?
      options:
        - flagzen-core
        - flagzen-test
        - flagzen-key-mapping
        - flagzen-env
        - flagzen-spring
        - flagzen-openfeature
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Define a @Feature interface with ...
        2. Create a @Variant with ...
        3. Resolve through FeatureDispatcher
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: Output of `java -version`
      placeholder: "17.0.12"
    validations:
      required: true

  - type: input
    id: flagzen-version
    attributes:
      label: FlagZen Version
      placeholder: "1.1.0"
    validations:
      required: true

  - type: dropdown
    id: build-tool
    attributes:
      label: Build Tool
      options:
        - Gradle
        - Maven
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Stack traces, screenshots, related issues, or anything else helpful.
