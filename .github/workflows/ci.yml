name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-markdown:
    name: "Markdown Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

  build:
    name: "Build & Test (Java ${{ matrix.java }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/reports/tests/
          retention-days: 14

  pitest:
    name: "Mutation Testing (PITest)"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run PITest
        run: ./gradlew :flagzen-core:pitest

      - name: Check mutation kill rate
        run: |
          REPORT="flagzen-core/build/reports/pitest/mutations.xml"
          if [ ! -f "$REPORT" ]; then
            echo "PITest XML report not found"
            exit 1
          fi
          TOTAL=$(grep -c '<mutation ' "$REPORT")
          KILLED=$(grep -c "status='KILLED'" "$REPORT" || true)
          if [ "$TOTAL" -eq 0 ]; then
            echo "No mutations found in report"
            exit 1
          fi
          KILL_RATE=$((KILLED * 100 / TOTAL))
          echo "Mutation kill rate: ${KILL_RATE}% (${KILLED}/${TOTAL})"
          if [ "$KILL_RATE" -lt 80 ]; then
            echo "Kill rate ${KILL_RATE}% is below 80% threshold"
            exit 1
          fi

      - name: Upload PITest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: flagzen-core/build/reports/pitest/
          retention-days: 14
